<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    h3 {margin: 10px; font-size: 20px;}
    a {text-emphasis: filled red;}
    b {
      text-emphasis-style: filled;
      text-emphasis-color: red;
    }
    c {text-emphasis: open rgb(13, 190, 167);}
    d {text-emphasis: triangle #9097;}
    e {text-emphasis: "啊" lch(50% 50 180 / 0.6);}
    </style>
</head>
<body>
<h3><a>Nice Weather!!</a></h3>
<h3><b>Nice Weather!!</b></h3>
<h3><c>Nice Weather!!</c></h3>
<h3><d>Nice Weather!!</d></h3>
<h3><e>Nice Weather!!</e></h3>
</body>
</html>
