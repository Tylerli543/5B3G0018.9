<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3 {
            margin: 6px;
            color: rgb(127, 185, 255);
        }
        .a {
            text-decoration: underline auto solid;
            text-decoration-color: blue;
            text-decoration-thickness: 4px;
            font-size: 25px;
        }
        .b {
            text-decoration:underline auto wavy;
            text-decoration-color: rgb(255, 30, 0);
            text-decoration-thickness: 4px;
            font-size: 25px;}
        .c {
            text-decoration:line-through auto ;
            text-decoration-color: rgb(0, 255, 2);
            text-decoration-thickness: 4px;
            font-size: 25px;     
        }
        .d {
            text-decoration:underline dashed;
            text-decoration-color: rgb(255, 0, 255);
            text-decoration-thickness: 4px;
            font-size: 25px;
        }
    </style>
</head>
<body>
    <h3>今天天氣真好</h3>
    <span class="a">今天天氣真好</span><br>
    <span class="b">今天天氣真好</span><br>
    <span class="c">今天天氣真好</span><br>
    <span class="d">今天天氣真好</span>
</body>
</html>
